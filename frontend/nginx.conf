server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Proxy API calls to backend container
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Proxy Socket.IO (requires WebSocket upgrade)
    location /socket.io/ {
        proxy_pass         http://backend:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # Cache static assets — safe to cache aggressively since Vite fingerprints
    # every filename with a content hash; a new deploy means a new URL.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The service worker script and manifest must always be revalidated so
    # browsers/PWAs pick up a new deploy instead of running a stale worker.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # SPA — all routes go to index.html. index.html itself must never be
    # cached: it's what references the current (hashed) JS/CSS bundle, so a
    # stale cached copy points browsers at an old build indefinitely.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
